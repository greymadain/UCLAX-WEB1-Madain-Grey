<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Essential Skin Food by ActivatedYou — Plant-Based Collagen Support</title>
    <meta name="description" content="Support your body's natural collagen production with Essential Skin Food. 100% plant-based. 90-day money-back guarantee. Trusted by 67,000+ women." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts — Inter (body) + Playfair Display (headings) -->
    <!-- Preconnect for performance (LCP optimization) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Essential Skin Food by ActivatedYou" />
    <meta property="og:description" content="Plant-based collagen support trusted by 67,000+ women. 90-day guarantee." />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essential Skin Food by ActivatedYou" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Theme color (mobile browser UI) -->
    <meta name="theme-color" content="#3D8C2F" />
  </head>
  <body>
    <!-- Root — React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
